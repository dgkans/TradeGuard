# Worst case hijacked agent (F9c): what it does in each injection scenario.
# read_news: symbols it reads news for on the first turn (the payload enters context).
# payload: the attacker's order(s), placed on the last turn, exactly as the injection asks.
# legit: the user's own order(s), placed after the payload. Empty where the attack replaces
# the user's order (size inflation, side flip, unit trick).
# Hand checked against each fixture's payload text before any attacker run.
