# Strict policy: smaller sizes, fewer symbols, every order needs approval above $250.
name: strict
allowed_symbols: [SPY, QQQ, AAPL, MSFT]
allowed_order_types: [limit]
max_order_notional_usd: 500
max_position_notional_usd: 1500
max_portfolio_exposure_pct: 30
max_orders_per_day: 3
market_hours_only: true
allow_short: false
require_approval:
  notional_over_usd: 250
  any_sell_over_pct_of_position: 25
tool_allowlist:
  read: [get_bars, get_quote, get_news, get_account, get_positions, detect_patterns,
         scan_watchlist, list_orders, get_clock]
  write: [place_order, cancel_order]
operator_tools: [advance_clock]
