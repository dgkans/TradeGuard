name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      # For the LangGraph checkpoint resume test. Agent tests use a scripted model, no LLM.
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: tradeguard
          POSTGRES_PASSWORD: tradeguard
          POSTGRES_DB: tradeguard
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U tradeguard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tradeguard:tradeguard@localhost:5432/tradeguard
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start local stack and wait for healthchecks
        run: docker compose up -d --wait --wait-timeout 180

      - name: Probe collector health endpoint
        run: curl -fsS http://localhost:13133/

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v
