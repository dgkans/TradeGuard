[project]
name = "tradeguard"
version = "0.1.0"
description = "Safety and evaluation gateway for trading agents. Paper and replay only."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.118",
    "jsonschema>=4.25",
    "langchain-core>=1.6",
    "langchain-ollama>=1.1",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.2",
    "mcp>=2.3",
    "opentelemetry-exporter-otlp-proto-http>=1.36",
    "opentelemetry-sdk>=1.36",
    "pandas>=2.2",
    "psycopg[binary]>=3.3",
    "pyarrow>=21",
    "pydantic>=2.11",
    "python-dotenv>=1.1",
    "pyyaml>=6",
    "sqlalchemy>=2.0",
    "yfinance>=1.7",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.17",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
tradeguard = "services.agent.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF"]
# PLAN.md Section 8 prefers explicit for loops over any()/all() comprehensions.
ignore = ["SIM110"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works
"tests/**" = ["S101"]
# SQL here is assembled only from module constants (column lists, fixed clauses); every
# value goes through psycopg parameters.
"services/gateway/approvals.py" = ["S608"]
"services/gateway/audit.py" = ["S608"]  # column names are constants; values are bound parameters

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["services", "tests", "evals"]

# Plan Section 8: strict on the gateway. Applied to all of services/ so the
# gateway's imports from services.common are held to the same bar.
[[tool.mypy.overrides]]
module = ["services.*"]
strict = true

# No type stubs published; only the fixture downloader uses it.
[[tool.mypy.overrides]]
module = ["yfinance"]
ignore_missing_imports = true
