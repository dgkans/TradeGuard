name: tradeguard

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradeguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradeguard}
      POSTGRES_DB: ${POSTGRES_DB:-tradeguard}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/jaeger:2.10.0
    ports:
      - "16686:16686" # UI
    healthcheck:
      # Jaeger v2 serves its health check extension on 13133.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:13133/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "13133:13133" # health check
    depends_on:
      jaeger:
        condition: service_healthy
    healthcheck:
      # The collector image is distroless (no shell, curl or wget). The healthcheck
      # extension on :13133 is exposed to the host, and `make up` probes it there.
      # Inside the container, the best available liveness check is the binary itself.
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
